# Defaults for download-insta-tab/server.py. Command-line flags override these.
# No secrets belong here: the Chrome extension sends your cookies itself.
# Windows paths go in single quotes so backslashes stay literal.

output = 'C:\Users\karan\Downloads'
delete_originals = true        # keep only the final *_snapshot file per post

# Rate-limit safety (see README "Staying under Instagram's radar")
post_delay = [3.0, 8.0]        # random pause between posts in a run, seconds
max_batch = 100                # most posts accepted in one request
daily_cap = 200                # most posts per rolling 24 hours (0 = off)
